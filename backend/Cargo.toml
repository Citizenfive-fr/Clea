[package]
name = "clea"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "clea"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }

sqlx = { version = "0.9", features = ["postgres", "uuid", "time", "runtime-tokio"] }
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = { version = "0.6", features = ["zeroize"] }
rand = "0.10"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting"] }
totp-rs = { version = "5", features = ["gen_secret", "otpauth", "qr"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"

reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip"] }
rss = "2"
chrono = "0.4"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aes-gcm = { version = "0.11", features = ["zeroize"] }
getrandom = "0.4"
hkdf = "0.13"
zeroize = "1"
hpke = { version = "0.14", default-features = false, features = ["x25519", "alloc", "aes", "getrandom"] }
