name: Release

on:
  release:
    types: [published]

env:
  REGISTRY: git.citizenfive.fr
  IMAGE: git.citizenfive.fr/citizenfive-fr/clea

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@v3

      - name: Compute version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "full=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build
        env:
          DOCKER_BUILDKIT: "0"
        run: docker build --tag "${IMAGE}:${{ steps.version.outputs.full }}" .

      - name: Push
        env:
          FULL: ${{ steps.version.outputs.full }}
          MINOR: ${{ steps.version.outputs.minor }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          docker push "${IMAGE}:${FULL}"
          if [ "$PRERELEASE" != "true" ]; then
            for TAG in "$MINOR" latest; do
              docker tag "${IMAGE}:${FULL}" "${IMAGE}:${TAG}"
              docker push "${IMAGE}:${TAG}"
            done
          fi

      - name: Sign
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign sign --yes --key env://COSIGN_KEY "${IMAGE}:${{ steps.version.outputs.full }}"

      - name: Clean up
        if: always()
        run: |
          docker logout "$REGISTRY" || true
          docker rmi -f $(docker images -q "${IMAGE}") 2>/dev/null || true