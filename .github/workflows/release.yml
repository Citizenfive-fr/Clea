name: Release

on:
  release:
    types: [published]

env:
  REGISTRY: git.citizenfive.fr
  IMAGE: git.citizenfive.fr/citizenfive-fr/clea

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # cosign-installer v4 needs envsubst (gettext-base), missing from the runner image
      - name: Install envsubst
        run: |
          command -v envsubst >/dev/null && exit 0
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO=sudo
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq --no-install-recommends gettext-base

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Compute version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "full=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build
        env:
          DOCKER_BUILDKIT: "0"
        run: docker build --tag "${IMAGE}:${{ steps.version.outputs.full }}" .

      - name: Push
        id: push
        env:
          FULL: ${{ steps.version.outputs.full }}
          MINOR: ${{ steps.version.outputs.minor }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          docker push "${IMAGE}:${FULL}"
          # Sign the exact image that was built (its digest), not a tag that could move
          REF=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE}:${FULL}" \
            | grep "^${IMAGE}@sha256:" | head -n 1)
          [ -n "$REF" ] || { echo "Image digest not found after push"; exit 1; }
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          if [ "$PRERELEASE" != "true" ]; then
            for TAG in "$MINOR" latest; do
              docker tag "${IMAGE}:${FULL}" "${IMAGE}:${TAG}"
              docker push "${IMAGE}:${TAG}"
            done
          fi

      - name: Sign
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          REF: ${{ steps.push.outputs.ref }}
        run: cosign sign --yes --key env://COSIGN_KEY "$REF"

      - name: Clean up
        if: always()
        run: |
          docker logout "$REGISTRY" || true
          docker rmi -f $(docker images -q "${IMAGE}") 2>/dev/null || true