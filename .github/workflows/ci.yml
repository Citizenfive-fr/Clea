name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Vérifie aussi que le serveur compile : l'image lance `cargo build --release --locked`
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag clea:ci .
        env:
          DOCKER_BUILDKIT: "0"
      - name: Clean up
        if: always()
        run: docker rmi clea:ci || true

