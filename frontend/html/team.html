<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Équipe — Cléa</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .page-wrap { max-width: 800px; margin: 0 auto; padding: 1rem 0 2rem; }

    .users-table { width: 100%; border-collapse: collapse; }
    .users-table th {
      text-align: left; font-family: var(--font-mono); font-size: 0.72rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--soft-fg); padding: 0.9rem 1rem;
      background: color-mix(in oklch, var(--bg) 25%, transparent);
    }
    .users-table td {
      padding: 1rem;
      border-top: 1px solid var(--frost-line);
      font-size: 0.9rem; vertical-align: middle;
    }
    .users-table th:first-child, .users-table td:first-child { padding-left: 1.5rem; }
    .users-table th:last-child, .users-table td:last-child { padding-right: 1.5rem; text-align: right; }
    .users-table .user-name { display: block; font-weight: 500; }
    .users-table .user-email { display: block; font-size: 0.8125rem; color: var(--soft-fg); overflow-wrap: anywhere; }
    .row-actions { display: inline-flex; gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; }
    .status { display: inline-flex; align-items: center; gap: 0.4rem; }
    .status::before { content: ''; width: 0.45rem; height: 0.45rem; border-radius: 50%; background: currentColor; }
    .status--on { color: var(--brand-teal); }
    .status--off { color: var(--soft-fg); }
    .btn-danger { color: var(--danger-fg); }
    .role-badge {
      display: inline-block; padding: 0.2rem 0.6rem;
      border-radius: 9999px; font-size: 0.75rem; font-weight: 600;
    }
    .role-owner  { background: color-mix(in oklch, var(--brand-cyan) 18%, transparent); color: var(--brand-cyan); }
    .role-admin  { background: color-mix(in oklch, var(--brand-teal) 18%, transparent); color: var(--brand-teal); }
    .role-member { background: color-mix(in oklch, var(--fg) 8%, transparent); color: var(--soft-fg); }

    .invite-section { margin-top: 1.5rem; padding: 1.5rem; }
    .invite-title { font-size: 1rem; font-weight: 600; margin-bottom: 1.25rem; }
    .invite-form { display: flex; gap: 0.75rem; align-items: flex-end; flex-wrap: wrap; }
    .invite-form .field { flex: 1; min-width: 180px; margin: 0; }
    .invite-form .field label { font-size: 0.875rem; font-weight: 500; display: block; margin-bottom: 0.375rem; }
    .invite-form input, .invite-form select {
      width: 100%;
      background: var(--field-bg);
      border: 1px solid var(--border);
      border-radius: 0.6rem;
      padding: 0.625rem 0.875rem;
      font-size: 0.875rem;
      font-family: inherit;
      color: var(--fg);
      outline: none;
    }
    .invite-form input:focus, .invite-form select:focus { border-color: var(--primary); outline: 2px solid var(--primary); outline-offset: 1px; }
    .invite-form select option { background: var(--bg); }
    .invite-form .btn--primary { height: 2.6rem; padding: 0 1rem; }

    .invite-result {
      margin-top: 1.25rem;
      background: var(--success-bg);
      border: 1px solid var(--success-line);
      border-radius: 1rem;
      padding: 1rem;
      display: none;
    }
    .invite-result.visible { display: block; }
    .invite-result-label { font-size: 0.8rem; color: var(--muted-fg); margin-bottom: 0.5rem; }
    .invite-link-wrap { display: flex; gap: 0.5rem; align-items: center; }
    .invite-link {
      flex: 1; background: var(--field-bg);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 0.5rem 0.75rem; font-size: 0.8rem;
      color: var(--brand-teal); word-break: break-all;
      font-family: var(--font-mono);
    }
    .copy-btn { flex-shrink: 0; }

    .error-msg {
      color: var(--danger-fg); font-size: 0.85rem;
      margin-top: 0.75rem; display: none;
    }
    .error-msg.visible { display: block; }
  </style>
</head>
<body>
  <a href="#main" class="sr-only sr-only--focusable">Aller au contenu</a>
  <div class="page">
    <div class="animated-bg" aria-hidden="true">
      <div class="orb orb--cyan"></div>
      <div class="orb orb--pink"></div>
      <div class="orb orb--teal"></div>
    </div>

    <div class="app">
      {{SIDEBAR:/team}}
      <main class="main" id="main">
    <div class="page-wrap">
      <header class="page-intro">
        <p class="label">Administration</p>
        <h1 class="page-intro__title">Équipe</h1>
        <p class="page-intro__desc">Les personnes qui ont accès à Cléa, et les invitations en cours.</p>
      </header>

      <div class="card" style="padding: 0; overflow: hidden;">
        <table class="users-table" id="users-table">
          <thead>
            <tr>
              <th>Personne</th>
              <th>Rôle</th>
              <th>Statut</th>
              <th><span class="sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody id="users-body">
            <tr><td colspan="4" style="color:var(--soft-fg); text-align:center; padding:2rem;">Chargement…</td></tr>
          </tbody>
        </table>
      </div>

      <section class="invite-section card" id="invite-section" style="display:none" aria-labelledby="invite-title">
        <h2 class="invite-title" id="invite-title">Inviter une personne</h2>
        <div class="invite-form">
          <div class="field">
            <label for="invite-username">Nom d'utilisateur</label>
            <input id="invite-username" type="text" placeholder="prenom.nom" maxlength="50">
          </div>
          <div class="field">
            <label for="invite-email">Email</label>
            <input id="invite-email" type="email" placeholder="collaborateur@exemple.fr">
          </div>
          <div class="field" style="max-width:160px">
            <label for="invite-role">Rôle</label>
            <select id="invite-role">
              <option value="member">Membre</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <button class="btn btn--primary" id="invite-btn" style="margin-bottom:1px">Générer le lien</button>
        </div>
        <div class="error-msg" id="invite-error"></div>
        <div class="invite-result" id="invite-result">
          <p class="invite-result-label">Lien d'invitation, valable 72 h. Envoie-le toi-même à la personne :</p>
          <div class="invite-link-wrap">
            <span class="invite-link" id="invite-link-text"></span>
            <button class="btn btn--outline copy-btn" id="copy-btn">Copier</button>
          </div>
        </div>
      </section>
    </div>
      </main>
    </div>
  </div>

  <script>
    let currentUser = null;

    fetch('/api/auth/me')
      .then(r => { if (!r.ok) window.location.href = '/login'; return r.json(); })
      .then(user => {
        currentUser = user;
        // Only the owner can invite admins (enforced server side too)
        if (user.role !== 'owner') {
          const adminOption = document.querySelector('#invite-role option[value="admin"]');
          if (adminOption) adminOption.remove();
        }
        document.getElementById('invite-section').style.display = 'block';
        loadUsers();
      })
      .catch(() => window.location.href = '/login');

    function roleBadge(role) {
      const label = { owner: 'Propriétaire', admin: 'Admin', member: 'Membre' }[role] || role;
      return `<span class="role-badge role-${escHtml(role)}">${escHtml(label)}</span>`;
    }

    function escHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function canDelete(target) {
      if (!currentUser) return false;
      if (target.email === currentUser.email) return false;
      if (currentUser.role === 'owner') return true;
      if (currentUser.role === 'admin') return target.role === 'member';
      return false;
    }

    function loadUsers() {
      fetch('/api/users')
        .then(r => r.json())
        .then(users => {
          const tbody = document.getElementById('users-body');
          if (!users.length) {
            tbody.innerHTML = '<tr><td colspan="4" style="color:var(--muted-fg);text-align:center;padding:2rem">Aucun membre</td></tr>';
            return;
          }
          tbody.innerHTML = users.map(u => `
            <tr>
              <td>
                ${u.username ? `<span class="user-name">${escHtml(u.username)}</span>` : ''}
                <span class="user-email">${escHtml(u.email)}</span>
              </td>
              <td>${roleBadge(u.role)}</td>
              <td><span class="status ${u.is_active ? 'status--on' : 'status--off'}">${u.is_active ? 'Actif' : 'Inactif'}</span></td>
              <td>
                <div class="row-actions">
                ${canDelete(u) ? `<button class="btn btn--ghost" style="font-size:0.8rem;padding:0.25rem 0.6rem" data-action="logoutUser" data-id="${escHtml(u.id)}" data-email="${escHtml(u.email)}">Déconnecter</button>` : ''}
                ${canDelete(u) ? `<button class="btn btn--ghost btn-danger" style="font-size:0.8rem;padding:0.25rem 0.6rem" data-action="deleteUser" data-id="${escHtml(u.id)}" data-email="${escHtml(u.email)}">Supprimer</button>` : ''}
                </div>
              </td>
            </tr>
          `).join('');
        });
    }

    async function logoutUser(id, email) {
      if (!confirm(`Déconnecter ${email} de toutes ses sessions ?`)) return;
      const res = await fetch(`/api/users/${id}/sessions`, { method: 'DELETE' });
      if (res.ok) {
        loadUsers();
      } else {
        const d = await res.json().catch(() => ({}));
        alert(d.error || 'Erreur.');
      }
    }

    async function deleteUser(id, email) {
      if (!confirm(`Supprimer ${email} ?`)) return;
      const res = await fetch(`/api/users/${id}`, { method: 'DELETE' });
      if (res.ok) {
        loadUsers();
      } else {
        const d = await res.json().catch(() => ({}));
        alert(d.error || 'Erreur.');
      }
    }

    document.getElementById('invite-btn').addEventListener('click', async () => {
      const username = document.getElementById('invite-username').value.trim();
      const email    = document.getElementById('invite-email').value.trim();
      const role     = document.getElementById('invite-role').value;
      const errEl    = document.getElementById('invite-error');
      errEl.classList.remove('visible');
      document.getElementById('invite-result').classList.remove('visible');

      if (!username) { errEl.textContent = 'Nom d\'utilisateur requis.'; errEl.classList.add('visible'); return; }
      if (!email)    { errEl.textContent = 'Email requis.'; errEl.classList.add('visible'); return; }

      const btn = document.getElementById('invite-btn');
      btn.disabled = true;

      try {
        const res = await fetch('/api/invitations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, role }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          errEl.textContent = data.error || 'Erreur.';
          errEl.classList.add('visible');
          return;
        }
        const link = `${window.location.origin}/invite?token=${data.token}`;
        document.getElementById('invite-link-text').textContent = link;
        document.getElementById('invite-result').classList.add('visible');
        document.getElementById('invite-username').value = '';
        document.getElementById('invite-email').value = '';
        loadUsers();
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('copy-btn').addEventListener('click', () => {
      const text = document.getElementById('invite-link-text').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = 'Copié !';
        setTimeout(() => btn.textContent = 'Copier', 2000);
      });
    });

    // Inline handlers are blocked by the CSP: one delegated listener instead
    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const { action, id, email } = el.dataset;
      if (action === 'logoutUser') logoutUser(id, email);
      if (action === 'deleteUser') deleteUser(id, email);
    });
  </script>
  <script src="/js/recovery-notice.js"></script>
</body>
</html>
