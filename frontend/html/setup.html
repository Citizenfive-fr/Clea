<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuration initiale — Cléa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .setup-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .setup-card {
      width: 100%;
      max-width: 440px;
      padding: 2.5rem;
    }
    .setup-logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--brand-teal);
      -webkit-text-fill-color: var(--brand-teal);
      margin-bottom: 0.25rem;
    }
    .setup-subtitle {
      color: var(--muted-fg);
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }
    .setup-section {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted-fg);
      margin: 1.5rem 0 0.75rem;
    }
    .setup-section:first-of-type { margin-top: 0; }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      margin-bottom: 1rem;
    }
    .field label {
      font-size: 0.875rem;
      color: var(--fg);
      font-weight: 500;
    }
    .field input {
      background: oklch(0.14 0.015 240);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.625rem 0.875rem;
      font-size: 0.9rem;
      font-family: inherit;
      color: var(--fg);
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus {
      border-color: var(--primary);
    }
    .field input::placeholder { color: var(--muted-fg); }
    .hint {
      font-size: 0.75rem;
      color: var(--muted-fg);
    }
    .setup-btn {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .setup-error {
      background: oklch(0.25 0.06 15 / 60%);
      border: 1px solid oklch(0.45 0.12 15 / 60%);
      color: oklch(0.85 0.08 15);
      border-radius: 8px;
      padding: 0.625rem 0.875rem;
      font-size: 0.85rem;
      margin-top: 1rem;
      display: none;
    }
    .setup-error.visible { display: block; }
  </style>
</head>
<body>
  <div class="page">
  <div class="animated-bg" aria-hidden="true">
    <div class="orb orb--cyan"></div>
    <div class="orb orb--pink"></div>
    <div class="orb orb--teal"></div>
  </div>

  <div class="setup-wrap">
    <div class="card setup-card">
      <div class="setup-logo">Cléa</div>
      <p class="setup-subtitle">Configuration initiale — créez votre espace de travail.</p>

      <form id="setup-form" novalidate>
        <p class="setup-section">Entreprise</p>

        <div class="field">
          <label for="org_name">Nom de l'entreprise</label>
          <input id="org_name" name="org_name" type="text"
                 placeholder="Ma Société" autocomplete="organization" required>
        </div>

        <p class="setup-section">Compte administrateur</p>

        <div class="field">
          <label for="username">Nom d'utilisateur</label>
          <input id="username" name="username" type="text"
                 placeholder="admin" maxlength="50" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email"
                 placeholder="admin@exemple.fr" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password">Mot de passe</label>
          <input id="password" name="password" type="password"
                 placeholder="12 caractères minimum" autocomplete="new-password" maxlength="128" required>
          <span class="hint">Entre 12 et 128 caractères.</span>
        </div>

        <div class="field">
          <label for="password_confirm">Confirmer le mot de passe</label>
          <input id="password_confirm" name="password_confirm" type="password"
                 autocomplete="new-password" maxlength="128" required>
        </div>

        <div class="setup-error" id="setup-error" role="alert"></div>

        <button type="submit" class="btn setup-btn">Créer l'espace de travail</button>
      </form>
    </div>
  </div>
  </div><!-- /.page -->

  <script>
    // Redirect if already configured
    fetch('/api/setup/status')
      .then(r => r.json())
      .then(data => { if (data.completed) window.location.href = '/'; })
      .catch(() => {});

    const form  = document.getElementById('setup-form');
    const error = document.getElementById('setup-error');

    function showError(msg) {
      error.textContent = msg;
      error.classList.add('visible');
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      error.classList.remove('visible');

      const org_name         = form.org_name.value.trim();
      const username         = form.username.value.trim();
      const email            = form.email.value.trim();
      const password         = form.password.value;
      const password_confirm = form.password_confirm.value;

      if (!org_name)           return showError("Le nom d'entreprise est requis.");
      if (!username)           return showError("Le nom d'utilisateur est requis.");
      if (!email.includes('@')) return showError("L'adresse email est invalide.");
      if (password.length < 12) return showError("Le mot de passe doit contenir au moins 12 caractères.");
      if (password !== password_confirm) return showError("Les mots de passe ne correspondent pas.");

      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Création en cours…';

      try {
        const res = await fetch('/api/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ org_name, username, email, password }),
        });

        if (res.status === 201) {
          window.location.href = '/';
          return;
        }

        const data = await res.json().catch(() => ({}));
        showError(data.error || "Une erreur est survenue.");
      } catch {
        showError("Impossible de contacter le serveur.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Créer l'espace de travail";
      }
    });
  </script>
</body>
</html>
