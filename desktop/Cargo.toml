[package]
name = "clea-desktop"
version = "0.2.1"
description = "Application de bureau pour se connecter à une instance Cléa"
license = "AGPL-3.0-only"
edition = "2021"

# Déjà utilisé par Tauri sous Linux : fenêtre « Enregistrer sous » des téléchargements
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Pareil : page d'erreur quand le serveur ne répond pas
webkit2gtk = "2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Vérifie qu'un Cléa répond avant d'enregistrer son adresse (pas de HTTPS dans std).
# Certificats vérifiés avec ceux du système, comme le fait la vue web.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
