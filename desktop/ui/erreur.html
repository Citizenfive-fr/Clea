<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cléa ne répond pas</title>
  <style>{{STYLE}}</style>
</head>
<body>
  <main class="card">
    <h1>Ton Cléa ne répond pas</h1>

    </p>
    <p class="hint">Adresse : {{SERVER}}</p>
    <a class="button" href="{{URL}}">Réessayer</a>
    <a class="button button--secondary" href="clea-app:changer-serveur">Changer de serveur</a>
  </main>
</body>
</html>
